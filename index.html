<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickerSQL - 本地轻量高性能数据分析工具</title>
  </head>

  <body>
    <div id="root"></div>
    <script>
      // 全局错误捕获 - 诊断启动卡死问题
      window.addEventListener('error', function(e) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:red;color:white;padding:12px;font-size:14px;font-family:monospace;white-space:pre-wrap;';
        d.textContent = '[DIAG-JS-ERROR] ' + (e.message || 'unknown') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + (e.error && e.error.stack ? e.error.stack : '');
        document.body.appendChild(d);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:darkred;color:white;padding:12px;font-size:14px;font-family:monospace;white-space:pre-wrap;';
        d.textContent = '[DIAG-JS-REJECTION] ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
        document.body.appendChild(d);
      });
      console.log('[DIAG-JS] index.html scripts loaded, waiting for main.tsx...');
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
