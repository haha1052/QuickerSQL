[package]
name = "tv_sc"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[profile.dev]
incremental = true

[profile.release]
incremental = true

[lib]
name = "tv_sc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
# tauri-plugin-fs = "2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
specta = { version = "2.0.0-rc.25", features = ["derive"] }
encoding_rs = "0.8.34"
dirs = "5.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
tempfile = "3.8"
duckdb = { version = "1.105", features = ["bundled", "vtab-full"] }
regex = "1.10"
log = "0.4"
calamine = "0.26"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
