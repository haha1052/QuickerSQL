        }
        if (now > 30000) clearInterval(intervalId);
      }, 50);

      window.__CLEAR_SPLASH_TIMER__ = function() {
        if (intervalId) clearInterval(intervalId);
      };
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
